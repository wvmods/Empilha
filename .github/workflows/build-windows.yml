name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar projeto Windows
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.example --project-name tetris_game .
          python tools/setup_windows.py

      - name: Dependências
        run: flutter pub get

      - name: Compilar
        run: flutter build windows --release

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Tetris-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tetris-Windows
          path: Tetris-Windows.zip

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tetris-Windows.zip
