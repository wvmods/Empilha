name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - name: Gerar plataforma Windows
        run: flutter create --platforms=windows --org com.empilha --project-name empilha_game .

      - name: Nome, janela e ícone do app
        run: python tools/setup_windows.py

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Compactar
        shell: pwsh
        run: |
          if (-not (Test-Path build\windows\x64\runner\Release\empilha.exe)) {
            Get-ChildItem build\windows\x64\runner\Release
            throw "empilha.exe não foi gerado"
          }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Empilha-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Empilha-Windows
          path: Empilha-Windows.zip

      - name: Publicar release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Empilha-Windows.zip
