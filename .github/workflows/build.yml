name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gera a pasta android/ (não precisa versionar)
      - name: Gerar plataforma Android
        run: flutter create --platforms=android --org com.example --project-name tetris_game .

      # Nome do app = "Tetris" e ícone = peça T (gerado por tools/make_icon.py)
      - name: Nome e ícone do app
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Tetris"/' android/app/src/main/AndroidManifest.xml
          python3 tools/make_icon.py android/app/src/main/res
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # O número da build sobe a cada execução, para o Android aceitar a atualização.
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      # Assina sempre com a MESMA chave (tools/release.keystore.b64).
      # É isso que permite instalar a versão nova por cima da antiga.
      - name: Assinar APK com a chave fixa
        env:
          KS_PASS: abec85afb77c26f9eaa9fd05
        run: |
          base64 -d tools/release.keystore.b64 > "$RUNNER_TEMP/release.p12"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=build/app/outputs/flutter-apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias tetris --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "$OUT/Tetris.apk" "$OUT/app-release.apk"
          "$APKSIGNER" verify --print-certs "$OUT/Tetris.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-apk
          path: build/app/outputs/flutter-apk/Tetris.apk

      - name: Publicar release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Tetris.apk
