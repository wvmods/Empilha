name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar plataforma Android
        run: flutter create --platforms=android --org com.empilha --project-name empilha_game .

      - name: Nome e ícone do app
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Empilha"/' android/app/src/main/AndroidManifest.xml
          python3 tools/make_icon.py android/app/src/main/res

      - run: flutter pub get

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      # A chave fica em Secrets (nunca no repositório). Sem os Secrets o build
      # continua e o APK sai com a assinatura de debug.
      - name: Assinar APK com a chave fixa
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Secrets de assinatura não configurados: mantendo a assinatura de debug."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass env:KS_PASS \
            --ks-key-alias "$KS_ALIAS" --key-pass env:KS_PASS \
            build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify build/app/outputs/flutter-apk/app-release.apk
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Empilha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Empilha-APK
          path: Empilha.apk

      - name: Publicar release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Empilha.apk
